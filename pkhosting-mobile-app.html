<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PK Hosting Mobile App</title>
<style>
:root{--g:#138a3d;--g2:#0e6e2f;--dk:#1c1919;--ink:#1a1f1c;--bg:#f6f8f6;--line:#e1e7e2;--mut:#667068}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:#d3dbd5;display:flex;justify-content:center;min-height:100vh}
button,select,textarea,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
#app{width:100%;max-width:420px;height:100vh;max-height:880px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;margin:auto}
@media(min-width:500px){#app{border-radius:34px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:8px solid #1c1919;height:860px}}
.promo{background:var(--g);color:#fff;font-size:12.5px;font-weight:600;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;position:relative}
.promo button{border:0;background:#fff;color:var(--ink);font-weight:800;border-radius:6px;padding:2px 8px;font-size:12px}
.promo .x{background:none;color:#fff;position:absolute;right:6px;top:4px;font-size:16px}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.lg{font-weight:800;font-size:20px;letter-spacing:-.03em;flex:1;display:flex;align-items:center;gap:4px}
.lg i{display:inline-grid;gap:2px;width:16px}.lg i:before,.lg i:after{content:"";height:5px;background:var(--g);border-radius:1px}
.ib{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:38px;position:relative;font-size:12px;font-weight:700}
.ib b{position:absolute;top:-6px;right:-6px;background:var(--g);color:#fff;border-radius:99px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center}
.gs{border:0;background:var(--g);color:#fff;font-weight:700;border-radius:10px;padding:9px 14px;font-size:14px}
#scr{flex:1;overflow:auto;padding-bottom:16px}
.pad{padding:0 16px}
.hero{background:radial-gradient(120% 90% at 0 0,#3a1d22 0,var(--dk) 55%,#1a2a1f 100%);color:#fff;padding:26px 16px 24px}
.hero small{color:#6ee09a;font-weight:600}
.hero h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:8px 0 10px}
.hero p{color:#d6dbd7;font-size:14.5px}
.row{display:flex;gap:10px;margin-top:16px}.row>*{flex:1}
.btn{border:0;background:var(--g);color:#fff;font-weight:700;border-radius:10px;padding:12px 14px;text-align:center}
.btn.w{background:#fff;color:var(--ink)}.btn.o{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;flex:none}
.sb{display:flex;gap:8px;margin-top:14px}.sb input{flex:1;min-width:0;border:0;border-radius:10px;padding:12px;background:#fff;color:var(--ink)}
.exts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.exts span{background:rgba(255,255,255,.12);border-radius:99px;padding:3px 10px;font-size:12px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 16px}
.trust div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}.trust b{display:block;color:var(--g);font-size:15px}
h2{font-size:20px;letter-spacing:-.02em;margin:20px 16px 4px}.sub{color:var(--mut);margin:0 16px 12px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 16px 12px}
.card h3{font-size:16px}.card p{color:var(--mut);font-size:13.5px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}.feat .card{margin:0}
.brands{display:flex;gap:8px;flex-wrap:wrap;margin:0 16px}.brands span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.seg{display:flex;margin:0 16px 12px;background:#e9eee9;border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px;font-weight:600;font-size:13.5px}.seg button.on{background:#fff;color:var(--g)}
.plan{position:relative}.plan.pop{border:2px solid var(--g)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;background:#e3f4e9;color:var(--g2);border-radius:99px;padding:2px 10px;margin-bottom:6px}
.price{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:6px}.price small{font-size:13px;font-weight:500;color:var(--mut)}
.plan ul{list-style:none;padding:0;margin:10px 0 12px}.plan li{font-size:13.5px;padding:3px 0 3px 22px;position:relative}
.plan li:before{content:"\2713";position:absolute;left:0;color:var(--g);font-weight:800}
.loc{font-size:12.5px;color:var(--mut)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item div{flex:1}.item small{display:block;color:var(--mut);font-size:12.5px}
.tag{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:#e3f4e9;color:var(--g2)}.tag.r{background:#fde2e2;color:#b91c1c}
label{font-weight:600;font-size:14px;display:block;margin:10px 0 6px}
.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}textarea.f{min-height:90px;resize:none}
.chat{display:flex;flex-direction:column;gap:8px;margin:8px 0}.msg{max-width:84%;padding:8px 12px;border-radius:14px;font-size:14px}
.msg.b{background:var(--bg);border:1px solid var(--line);align-self:flex-start}.msg.u{background:var(--g);color:#fff;align-self:flex-end}
.tot{display:flex;justify-content:space-between;padding:6px 0}.tot.b{font-weight:800;font-size:17px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 4px 2px}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11.5px;font-weight:600;display:grid;justify-items:center;gap:2px}
nav button b{width:40px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:11px}
nav button.on{color:var(--g)}nav button.on b{background:#e3f4e9}
.pw{background:#fff;text-align:center;font-size:11px;color:var(--mut);padding:0 0 calc(6px + env(safe-area-inset-bottom,0px))}
.toast{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;z-index:9}.toast.on{opacity:1}
.foot{margin:20px 16px 0;color:var(--mut);font-size:12.5px;text-align:center}
</style>
</head>
<body>

const foot=`<p class="foot">PK Hosting, 231-B Main Boulevard, Phase 8 DHA, Lahore<br>A product of TechAbout (Private) Limited</p>`;
function home(){S.innerHTML=`<div class="hero"><small>16+ Years, Pakistan Hosting Support</small><h1>Web Hosting in Pakistan with Local Support</h1><p>We treat your website as our own. Compare hosting, domains, VPS and dedicated server options, then complete checkout and billing here.</p>
<div class="row"><button class="btn w" data-tab="pricing">View Pricing</button><button class="btn o" style="color:#fff;border-color:#ffffff55" data-pick="cloud">Explore Servers</button></div>
<div class="sb"><input id="hq" placeholder="Find your domain" aria-label="Domain name"><button class="btn" id="hs">Search</button></div><div class="exts">${DOM.slice(0,5).map(d=>`<span>${d[0]} ${d[1]}${d[2]}</span>`).join('')}</div></div>

<div class="card"><h3>Live chat</h3><div class="chat" id="ch"><div class="msg b">Assalam o Alaikum! How can we help?</div></div><div class="sb" style="margin:0"><input class="f" id="cm" placeholder="Type a message" aria-label="Message"><button class="btn" id="cs">Send</button></div></div>${foot}`;
$('#tb').onclick=()=>{const s=$('#ts').value.trim();if(!s||!$('#tm').value.trim())return toast('Fill subject and message');tix.unshift(s);toast('Ticket sent');support()};
$('#cs').onclick=()=>{const v=$('#cm').value.trim();if(!v)return;$('#ch').insertAdjacentHTML('beforeend','<div class="msg u"></div>');$('#ch').lastChild.textContent=v;$('#cm').value='';setTimeout(()=>$('#ch').insertAdjacentHTML('beforeend','<div class="msg b">Thanks. A team member will reply shortly.</div>'),700)}}
function account(){S.innerHTML=`<h2 style="margin-top:16px">Client login</h2><p class="sub">Manage services, invoices and payments.</p><div class="card"><label>Email</label><input class="f" id="le" type="email" placeholder="you@example.com"><label>Password</label><input class="f" id="lp" type="password"><button class="btn" id="lb" style="width:100%;margin-top:14px">Log in</button></div>
<div class="card"><h3>We accept</h3><p>Stripe, PayPal, JazzCash, Easypaisa, Bank account</p></div>${foot}`;
$('#lb').onclick=()=>{if(!$('#le').value||!$('#lp').value)return toast('Enter email and password');dash()}}
function dash(){S.innerHTML=`<h2 style="margin-top:16px">My services</h2><div class="card"><div class="item"><div>Business Hosting<small>mybrand.pk</small></div><span class="tag">Active</span></div><div class="item"><div>Disk 8 / 25 GB<small>Email accounts 6 / 25</small></div><button class="btn sm" data-t="Opening dashboard">Manage</button></div></div>
<h2>Invoices</h2><div class="card"><div class="item"><div>INV-1042<small>Business Hosting, Rs 19,990</small></div><button class="btn sm" data-t="Payment page opened">Pay</button></div><div class="item"><div>INV-1017<small>mybrand.pk, Rs 4,699</small></div><span class="tag">Paid</span></div></div><button class="btn o" style="margin:0 16px;width:calc(100% - 32px)" data-tab="account">Log out</button>`}
function cartView(){const sub=cart.reduce((a,c)=>a+c.price,0),dis=coupon?Math.round(cart.filter(c=>c.disc).reduce((a,c)=>a+c.price,0)*.1):0;
S.innerHTML=`<h2 style="margin-top:16px">Your cart</h2>`+(cart.length?`<div class="card">${cart.map((c,i)=>`<div class="item"><div>${c.name}<small>${c.term}</small></div><b>${fm(c.price)}</b><button class="btn sm o" data-rm="${i}" aria-label="Remove">x</button></div>`).join('')}</div>
<div class="card"><label>Coupon code</label><div class="sb" style="margin:0"><input class="f" id="co" placeholder="WELCOME10"><button class="btn" id="ca">Apply</button></div><p style="margin-top:6px">${coupon?'WELCOME10 applied to shared and reseller hosting.':'10% off shared and reseller hosting for new customers.'}</p></div>
<div class="card"><div class="tot"><span>Subtotal</span><span>${fm(sub)}</span></div>${dis?`<div class="tot"><span>Discount</span><span>- ${fm(dis)}</span></div>`:''}<div class="tot b"><span>Total</span><span>${fm(sub-dis)}</span></div><label>Payment method</label><select class="f"><option>Stripe</option><option>PayPal</option><option>JazzCash</option><option>Easypaisa</option><option>Bank account</option></select><button class="btn" style="width:100%;margin-top:14px" id="ck">Checkout securely</button></div>`:'<div class="card" style="text-align:center;color:var(--mut)">Your cart is empty.<br><button class="btn" style="margin-top:12px" data-tab="pricing">View pricing</button></div>');
if($('#ca'))$('#ca').onclick=()=>{if($('#co').value.trim().toUpperCase()=='WELCOME10'){coupon=true;cartView();toast('Coupon applied')}else toast('Invalid coupon')};
if($('#ck'))$('#ck').onclick=()=>{cart=[];coupon=false;upd();toast('Order placed. We will confirm shortly.');cartView()}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.tab)setTab(d.tab);
else if(d.pick){cat=d.pick;term=term;setTab('pricing')}
else if(d.term){term=d.term;pricing()}
else if(d.add){const[c,i]=d.add.split('|'),C=CATS[c],p=C.p[i];if(C.q)return toast('Quote request sent for '+p[0]);cart.push({name:p[0],term:term=='m'?'Monthly':'Annually',price:term=='m'?p[3]:p[4],disc:c=='shared'||c=='reseller'});upd();toast(p[0]+' added to cart')}
else if(d.dom){const[n,pr]=d.dom.split('|');cart.push({name:n,term:'Domain registration',price:+pr});upd();toast(n+' added to cart')}
else if(d.rm){cart.splice(+d.rm,1);upd();cartView()}
else if(d.t)toast(d.t);
else if(b.id=='cp'){navigator.clipboard&&navigator.clipboard.writeText('WELCOME10').catch(()=>{});toast('WELCOME10 copied')}
else if(b.id=='px')$('#pr').remove()});
home();
</script>
</body>
</html>
